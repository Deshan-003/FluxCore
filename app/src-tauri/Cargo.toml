[package]
name = "fluxcore"
version = "0.1.0"
description = "Windows hardware monitoring and resource intelligence"
authors = ["FluxCore"]
edition = "2021"

[lib]
name = "fluxcore_lib"
# staticlib + rlib only: a cdylib of this size exceeds the PE 65535 export
# ordinal limit when linked with mingw, and desktop Windows links the rlib.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network", "windows"] }
rusqlite = { version = "0.32", features = ["bundled"] }
libloading = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network", "windows"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_System_Performance", "Win32_System_IO", "Win32_System_Ioctl"] }


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
