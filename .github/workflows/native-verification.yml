name: Native verification (Windows)

# Runs, on a GitHub-hosted Windows runner, the checks that Smart App Control
# blocks on the developer's own machine (os error 4551). A hosted runner has no
# such code-integrity policy, so the unsigned binaries execute normally.
#
# This produces the native evidence Phase 4 still lacks:
#   - the Rust suite executing natively on Windows/MSVC (incl. the fluxcore_lib harness)
#   - a native Phase 4 overhead benchmark run
#   - the MSI and NSIS installers

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
    paths:
      - "app/**"
      - ".github/workflows/native-verification.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/native-verification.yml"

permissions:
  contents: read

concurrency:
  group: native-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (lint, unit tests, production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:frontend
      - run: npm run build

  rust-native:
    name: Rust suite + native overhead benchmark (Windows, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # tauri-build / generate_context! expect frontendDist (../dist) to exist,
      # so build the assets the same way a local run does before compiling.
      - name: Build frontend assets
        working-directory: app
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: cargo test --locked (native Windows)
        working-directory: app/src-tauri
        run: cargo test --locked

      # Runs even when the test step fails so its numbers are still captured.
      - name: Native Phase 4 overhead benchmark
        if: always()
        working-directory: app/src-tauri
        shell: pwsh
        run: |
          cargo run --locked --release --example intelligence_benchmark |
            Tee-Object -FilePath native_benchmark_output.txt

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-benchmark-output
          path: app/src-tauri/native_benchmark_output.txt
          if-no-files-found: warn

  installer:
    name: MSI + NSIS installer build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Optional Authenticode code signing. Set repository secrets
      # WINDOWS_CERT_PFX_BASE64 (base64 of a .pfx with its private key) and
      # WINDOWS_CERT_PASSWORD to sign the app and both installers. With no
      # secrets present the job builds unsigned artifacts exactly as before.
      #
      # Signing is done inside `tauri build` via bundle.windows.certificateThumbprint
      # rather than with a post-build signtool pass: signing the finished .msi/.exe
      # afterwards does not cover the application executable packaged inside it,
      # and it is the installed app that Smart App Control evaluates. Note also
      # that SAC weighs publisher reputation, not merely "is signed" - a freshly
      # issued standard (OV) certificate can still be blocked until reputation
      # accrues; EV certificates and Azure Trusted Signing
      # (bundle.windows.signCommand) are the routes that clear it reliably.
      - name: Import code-signing certificate (optional)
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX_BASE64) {
            Write-Host 'No WINDOWS_CERT_PFX_BASE64 secret set - building unsigned artifacts.'
            Add-Content -Path $env:GITHUB_ENV -Value 'SIGN_CERT_THUMBPRINT='
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $password = ConvertTo-SecureString -String $env:CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
                  Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          Remove-Item $pfx -Force
          if (-not $cert) { throw 'the .pfx did not contain a certificate with a private key' }
          Write-Host "Imported signing certificate; valid until $($cert.NotAfter.ToString('u'))."
          Add-Content -Path $env:GITHUB_ENV -Value ('SIGN_CERT_THUMBPRINT=' + $cert.Thumbprint)

      # Tauri downloads NSIS and WiX v3 on first use. `tauri build` runs the
      # beforeBuildCommand (npm run build) and emits both bundle targets
      # (targets: ["nsis", "msi"] in tauri.conf.json).
      - name: Build app and bundles (msi, nsis)
        working-directory: app
        shell: pwsh
        run: |
          if ($env:SIGN_CERT_THUMBPRINT) {
            $config = Join-Path $env:RUNNER_TEMP 'tauri.signing.conf.json'
            @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $env:SIGN_CERT_THUMBPRINT
                  digestAlgorithm       = 'sha256'
                  timestampUrl          = 'http://timestamp.digicert.com'
                }
              }
            } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $config
            Write-Host 'Building with code signing enabled.'
            npm run tauri build -- --config $config
          } else {
            Write-Host 'Building unsigned (no signing certificate configured).'
            npm run tauri build
          }

      - name: Verify signatures (only when signed)
        shell: pwsh
        run: |
          if (-not $env:SIGN_CERT_THUMBPRINT) {
            Write-Host 'Signing not configured - skipping signature verification.'
            exit 0
          }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found in the Windows SDK' }

          $targets = @()
          $targets += Get-ChildItem 'app/src-tauri/target/release' -Filter '*.exe' -File -ErrorAction SilentlyContinue
          $targets += Get-ChildItem 'app/src-tauri/target/release/bundle/msi' -Filter '*.msi' -File -ErrorAction SilentlyContinue
          $targets += Get-ChildItem 'app/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File -ErrorAction SilentlyContinue
          if (-not $targets) { throw 'no build outputs were found to verify' }

          foreach ($target in $targets) {
            Write-Host "Verifying $($target.FullName)"
            & $signtool.FullName verify /pa /v $target.FullName
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed for $($target.Name)" }
          }
          Write-Host 'All build outputs carry a valid Authenticode signature.'

      # Native runtime smoke test: launch the real app and confirm it starts and
      # stays alive. SAC never applies on a hosted runner, so this exercises the
      # installed binary path (window + WebView2 + collector startup) that cannot
      # be run on a SAC-enforced developer machine.
      - name: Smoke-launch the built app
        shell: pwsh
        run: |
          $rel = 'app/src-tauri/target/release'
          $exe = @(Get-ChildItem -Path $rel -Filter 'FluxCore.exe' -File -ErrorAction SilentlyContinue) +
                 @(Get-ChildItem -Path $rel -Filter 'fluxcore.exe' -File -ErrorAction SilentlyContinue) |
                 Select-Object -First 1
          if (-not $exe) { throw "built executable not found under $rel" }

          $out = Join-Path $env:RUNNER_TEMP 'app-stdout.txt'
          $err = Join-Path $env:RUNNER_TEMP 'app-stderr.txt'
          Write-Host "Launching $($exe.FullName)"
          $proc = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 20

          if ($proc.HasExited) {
            $hex = '0x' + ('{0:X8}' -f $proc.ExitCode)
            Write-Host "Process exited during startup: $hex ($($proc.ExitCode))"
            if (Test-Path $err) { Write-Host '--- stderr ---'; Get-Content $err }
            throw "app exited during startup with $hex"
          }

          Write-Host "App still running after 20s (pid $($proc.Id))"
          if (Test-Path $err) {
            $text = Get-Content $err -Raw
            if ($text -match 'panicked|RUST_BACKTRACE') {
              Stop-Process -Id $proc.Id -Force
              throw "app panicked during startup:`n$text"
            }
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host 'Smoke launch OK'

      # tauri-service's auto-download helper calls a ZipFile.ExtractToDirectory
      # overload that does not exist under the Windows PowerShell 5.1 it invokes,
      # so install the driver matching the runner's WebView2 ourselves.
      - name: Install matching Edge WebDriver
        shell: pwsh
        run: |
          $roots = @(
            'C:\Program Files (x86)\Microsoft\EdgeWebView\Application',
            'C:\Program Files (x86)\Microsoft\Edge\Application'
          )
          $root = $roots | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $root) { throw 'No WebView2 or Edge installation found' }
          $version = Get-ChildItem $root -Directory |
                     Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
                     Sort-Object { [version]$_.Name } -Descending |
                     Select-Object -First 1 -ExpandProperty Name
          if (-not $version) { throw "No versioned runtime found under $root" }
          Write-Host "Installing msedgedriver for WebView2/Edge $version"

          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          $zip = Join-Path $env:RUNNER_TEMP 'msedgedriver.zip'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          Get-ChildItem $dir -Filter 'msedgedriver*.exe' | ForEach-Object { $_.FullName }

      # Drives the real release binary through tauri-driver + WebdriverIO:
      # collector status, sidebar navigation and a settings toggle. This covers
      # the interactive native UI path that a headless smoke launch cannot.
      - name: Install UI E2E dependencies
        working-directory: app/e2e-tests
        run: npm ci --no-audit --no-fund

      - name: Native UI E2E (tauri-driver + WebdriverIO)
        working-directory: app/e2e-tests
        run: npm test

      - name: Upload UI E2E logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-e2e-logs
          path: |
            app/e2e-tests/logs/**
            app/e2e-tests/*.log
          if-no-files-found: warn

      - name: Upload Windows bundles
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fluxcore-windows-bundles
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/fluxcore.exe
            app/src-tauri/target/release/FluxCore.exe
          if-no-files-found: warn
