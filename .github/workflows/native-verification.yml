name: Native verification (Windows)

# Runs, on a GitHub-hosted Windows runner, the checks that Smart App Control
# blocks on the developer's own machine (os error 4551). A hosted runner has no
# such code-integrity policy, so the unsigned binaries execute normally.
#
# This produces the native evidence Phase 4 still lacks:
#   - the Rust suite executing natively on Windows/MSVC (incl. the fluxcore_lib harness)
#   - a native Phase 4 overhead benchmark run
#   - the MSI and NSIS installers

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
    paths:
      - "app/**"
      - ".github/workflows/native-verification.yml"
  pull_request:
    paths:
      - "app/**"

permissions:
  contents: read

concurrency:
  group: native-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (lint, unit tests, production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:frontend
      - run: npm run build

  rust-native:
    name: Rust suite + native overhead benchmark (Windows, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # tauri-build / generate_context! expect frontendDist (../dist) to exist,
      # so build the assets the same way a local run does before compiling.
      - name: Build frontend assets
        working-directory: app
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: cargo test --locked (native Windows)
        working-directory: app/src-tauri
        run: cargo test --locked

      # Runs even when the test step fails so its numbers are still captured.
      - name: Native Phase 4 overhead benchmark
        if: always()
        working-directory: app/src-tauri
        shell: pwsh
        run: |
          cargo run --locked --release --example intelligence_benchmark |
            Tee-Object -FilePath native_benchmark_output.txt

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-benchmark-output
          path: app/src-tauri/native_benchmark_output.txt
          if-no-files-found: warn

  installer:
    name: MSI + NSIS installer build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Tauri downloads NSIS and WiX v3 on first use. `tauri build` runs the
      # beforeBuildCommand (npm run build) and emits both bundle targets
      # (targets: ["nsis", "msi"] in tauri.conf.json).
      # To ship signed installers instead of unsigned ones, add the
      # certificate/TAURI_SIGNING_* secrets and signing settings here.
      - name: Build app and bundles (msi, nsis)
        working-directory: app
        run: npm run tauri build

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v6
        with:
          name: fluxcore-windows-bundles
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/fluxcore.exe
            app/src-tauri/target/release/FluxCore.exe
          if-no-files-found: warn
